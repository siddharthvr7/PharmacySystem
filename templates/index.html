
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pharmacy System v1</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 35px auto;
            padding: 0 20px;
            background: #f4f6f9;
            color: #172033;
        }
        h1 { color: #173b70; }
        section {
            background: white;
            padding: 20px;
            margin: 20px 0;
            border-radius: 10px;
        }
        input, button {
            padding: 10px;
            margin: 5px 2px;
        }
        button {
            background: #173b70;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        table { width: 100%; border-collapse: collapse; }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
    </style>
</head>
<body>
    <h1>Pharmacy Management System</h1>
    <p>Version 1 | Medicine Inventory</p>

    <section>
        <h2>Add Medicine</h2>
        <form action="/add" method="post">
            <input name="name" placeholder="Medicine name" required>
            <input name="price" type="number" min="0.01" step="0.01"
                   placeholder="Unit price (₹)" required>
            <input name="stock" type="number" min="0"
                   placeholder="Stock quantity" required>
            <button type="submit">Add Item</button>
        </form>
    </section>

    <section>
        <h2>Available Medicines</h2>
        {% if medicines %}
        <table>
            <tr>
                <th>Medicine</th>
                <th>Price</th>
                <th>Stock</th>
            </tr>
            {% for name, item in medicines.items() %}
            <tr>
                <td>{{ name }}</td>
                <td>₹{{ "%.2f"|format(item.price) }}</td>
                <td>{{ item.stock }}</td>
            </tr>
            {% endfor %}
        </table>
        {% else %}
        <p>No medicines added yet.</p>
        {% endif %}
    </section>
</body>
</html>
