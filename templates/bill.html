
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Generated Bill - Pharmacy System V2</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
            background: #f4f6f9;
            color: #172033;
        }
        section {
            background: white;
            padding: 25px;
            border-radius: 10px;
        }
        table { width: 100%; border-collapse: collapse; }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        .total { font-size: 1.2em; font-weight: bold; }
        a {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 14px;
            background: #173b70;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <section>
        <h1>Pharmacy Bill</h1>
        <p>Bill #{{ bill.id }}</p>

        <table>
            <tr>
                <th>Medicine</th>
                <td>{{ bill.medicine }}</td>
            </tr>
            <tr>
                <th>Unit Price (INR)</th>
                <td>{{ "%.2f"|format(bill.unit_price) }}</td>
            </tr>
            <tr>
                <th>Quantity</th>
                <td>{{ bill.quantity }}</td>
            </tr>
            <tr>
                <th>Total (INR)</th>
                <td class="total">{{ "%.2f"|format(bill.total) }}</td>
            </tr>
        </table>

        <a href="/">Back to Pharmacy</a>
    </section>
</body>
</html>
